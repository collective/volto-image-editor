name: Acceptance tests
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true

jobs:
  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Main checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x
        with:
          working-directory: '.'

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_frontend@2.x
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: '.'

      - name: Install Playwright browsers
        run: make install-acceptance

      - uses: JarvusInnovations/background-action@v2
        name: Start Servers
        with:
          run: |
            make ci-acceptance-backend-start &
            make acceptance-frontend-prod-start &

          wait-on: |
            http-get://localhost:55001/plone
            http://localhost:3000

          tail: true # true = stderr,stdout

          log-output-resume: stderr

          wait-for: 10m

          log-output: stderr,stdout # same as true

          log-output-if: failure

      - name: Run acceptance tests
        run: make ci-acceptance-test

      # Upload Playwright report and traces
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-acceptance-report
          path: |
            playwright-report
            acceptance/results
